name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  slow:
    runs-on: docker
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # TODO: pin the image your forge's runner provides, or add a container: block.
      # TODO: set up the language toolchain and cache it.
      - run: make test-slow
      - run: make bench
      - uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        if: always()
        with:
          name: nightly-reports
          path: reports/
          if-no-files-found: ignore
