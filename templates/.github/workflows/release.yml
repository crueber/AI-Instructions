# TODO: make release must write dist/ and SHA256SUMS.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # TODO: set up the language toolchain.
      - run: make release
      - run: cd dist && sha256sum -c SHA256SUMS
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
      - run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
